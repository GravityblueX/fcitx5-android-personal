name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
      SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
      SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes extra-cmake-modules gettext

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: cmake;3.31.6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests and build release APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleReleasePlugins --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            plugin/**/build/outputs/apk/release/*.apk
