name: Personal build

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: personal-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build test APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes extra-cmake-modules gettext

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: cmake;3.31.6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run lint and unit tests
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :assembleDebugPlugins :app:assembleRelease :assembleReleasePlugins --stacktrace

      - name: Upload quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable debug plugins
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-debug-plugins
          path: plugin/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release plugins
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-unsigned-release-plugins
          path: plugin/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
