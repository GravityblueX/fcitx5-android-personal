name: Personal build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build test APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes extra-cmake-modules gettext

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: cmake;3.31.6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK and plugins
        run: ./gradlew :app:assembleRelease :assembleReleasePlugins --stacktrace

      - name: Upload main APK
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload plugin APKs
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-plugins
          path: plugin/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
