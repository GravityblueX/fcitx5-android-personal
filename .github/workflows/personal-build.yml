name: Personal build

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: personal-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
      SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
      SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes extra-cmake-modules gettext

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: cmake;3.31.6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run lint and unit tests
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :assembleDebugPlugins :app:assembleRelease :assembleReleasePlugins --stacktrace

      - name: Verify debug app and plugin integration
        run: |
          mapfile -t plugins < <(find plugin -path "*/build/outputs/apk/debug/*.apk" -type f | sort)
          bash scripts/verify-debug-plugin-compatibility.sh "$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)" "${plugins[@]}"

      - name: Upload quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable debug plugins
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-debug-plugins
          path: plugin/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release plugins
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-release-plugins
          path: plugin/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
