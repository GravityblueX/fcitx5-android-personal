name: Personal build

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: personal-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
      SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
      SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify release signing configuration
        run: |
          for secret in SIGN_KEY_BASE64 SIGN_KEY_PWD SIGN_KEY_ALIAS; do
            if [ -z "${!secret}" ]; then
              echo "::error title=Missing signing secret::$secret must be configured"
              exit 1
            fi
          done
          base64 --decode <<< "$SIGN_KEY_BASE64" >/dev/null

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes extra-cmake-modules gettext

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: cmake;3.31.6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run lint and unit tests
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :assembleDebugPlugins :app:assembleRelease :assembleReleasePlugins --stacktrace

      - name: Generate release APK checksums
        run: bash scripts/generate-release-checksums.sh

      - name: Verify debug app and plugin integration
        run: |
          host_apk_list=$(mktemp)
          plugin_apk_list=$(mktemp)
          trap 'rm -f -- "$host_apk_list" "$plugin_apk_list"' EXIT
          if ! find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" -type f -print0 | sort -z > "$host_apk_list"; then
            echo "::error title=Host APK discovery failed::Could not enumerate debug host APKs"
            exit 1
          fi
          if ! find plugin -path "*/build/outputs/apk/debug/*.apk" -type f -print0 | sort -z > "$plugin_apk_list"; then
            echo "::error title=Plugin APK discovery failed::Could not enumerate debug plugin APKs"
            exit 1
          fi
          mapfile -d '' host_apks < "$host_apk_list"
          mapfile -d '' plugins < "$plugin_apk_list"
          if (( ${#host_apks[@]} != 1 )); then
            echo "::error title=Unexpected debug host APK count::Expected exactly one debug host APK, found ${#host_apks[@]}"
            exit 1
          fi
          if (( ${#plugins[@]} == 0 )); then
            echo "::error title=Missing debug plugins::No debug plugin APKs were found"
            exit 1
          fi
          bash scripts/verify-debug-plugin-compatibility.sh "${host_apks[0]}" "${plugins[@]}"

      - name: Upload quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable debug plugins
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-debug-plugins
          path: plugin/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK checksums
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-release-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release plugins
        uses: actions/upload-artifact@v6
        with:
          name: fcitx17-release-plugins
          path: plugin/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
