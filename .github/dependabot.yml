version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
      time: "03:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
      time: "03:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
